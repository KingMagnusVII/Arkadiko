<!doctype html>
<html lang="en">
<!-- Popup UI: API settings, task input, status, result display, and copy action. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Bridge</title>
  <!-- Styling is local to this popup; no external assets are loaded. -->
  <style>
    body { width: 340px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #17202a; }
    h1 { margin: 0 0 12px; font-size: 17px; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 9px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { margin-top: 9px; border: 0; border-radius: 6px; background: #2457d6; color: white; cursor: pointer; }
    button.secondary { background: #465365; }
    button:disabled { opacity: .55; cursor: wait; }
    #status, #result { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #result { max-height: 180px; overflow: auto; padding: 8px; background: #f2f4f7; border-radius: 6px; }
    .hint { color: #667; font-size: 12px; }
  </style>
</head>
<body>
  <!-- The user reviews the task and explicitly clicks Send; there is no automatic handoff. -->
  <h1>OpenClaw Bridge</h1>
  <p class="hint">Manual handoff. Review the task before sending; nothing runs automatically.</p>
  <label for="endpoint">Local API URL</label>
  <input id="endpoint" value="http://127.0.0.1:8765">
  <label for="token">Bridge token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Local API token">
  <label for="task">Task</label>
  <textarea id="task" placeholder="Describe what OpenClaw should do..."></textarea>
  <button id="send">Send task to OpenClaw</button>
  <button id="check" class="secondary" disabled>Check latest result</button>
  <div id="status" role="status" aria-live="polite"></div>
  <pre id="result" hidden></pre>
  <button id="copy" class="secondary" hidden>Copy report for ChatGPT</button>
  <script src="popup.js"></script>
</body>
</html>
