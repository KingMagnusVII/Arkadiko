<!doctype html>
<html lang="en">
<!-- Mono/frosted popup inspired by the supplied HaloInput and BorderBeamCard examples. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --card: #111111;
      --card-2: #151515;
      --text: #f5f5f5;
      --muted: #8d8d8d;
      --border: #292929;
      --beam: #f5f5f5;
      --field: #0d0d0d;
      --field-border: #303030;
    }

    * { box-sizing: border-box; }

    body {
      width: 380px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .beam-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(145deg, #151515, #0d0d0d 58%, #111111);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
    }

    .beam-card::before {
      content: "";
      position: absolute;
      inset: -45%;
      background: conic-gradient(from 0deg, transparent 0 72%, rgba(255,255,255,.9) 76%, transparent 80% 100%);
      animation: beam 5s linear infinite;
      pointer-events: none;
      opacity: .7;
    }

    .beam-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(20,20,20,.98), rgba(9,9,9,.98));
      pointer-events: none;
    }

    .inner { position: relative; z-index: 1; padding: 18px; }

    @keyframes beam {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .beam-card::before { animation: none; }
      .halo::before { animation: none; }
    }

    header { margin-bottom: 18px; }
    .eyebrow {
      margin: 0 0 5px;
      color: #aaa;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -.035em;
    }
    .description {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .section { margin-top: 15px; }
    label {
      display: block;
      margin: 0 0 7px;
      color: #d5d5d5;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    /* Shared monochrome HaloInput shell for fields and scrollable report surfaces. */
    .halo {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(135deg, #f2f2f2 0%, #777 18%, #252525 42%, #bdbdbd 72%, #444 100%);
    }

    /* Soft monochrome halo texture sits behind each field/report surface. */
    .halo::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: 11px;
      overflow: hidden;
      background:
        radial-gradient(90% 70% at 50% 100%, rgba(255,255,255,.28), rgba(220,220,220,.12) 48%, transparent 62%),
        radial-gradient(70% 55% at 30% 0%, rgba(255,255,255,.22), rgba(225,225,225,.08) 45%, transparent 58%);
      filter: blur(13px);
      opacity: .5;
      pointer-events: none;
    }

    /* A restrained moving silver highlight keeps the original HaloInput texture. */
    .halo::after {
      content: "";
      position: absolute;
      z-index: 0;
      left: -5%;
      bottom: -8px;
      width: 46%;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f5f5f5, #bdbdbd, #777, #e8e8e8);
      filter: blur(8px);
      opacity: .62;
      pointer-events: none;
      animation: halo-sweep 6s ease-in-out infinite;
    }

    @keyframes halo-sweep {
      0%, 100% { left: -5%; }
      50% { left: 65%; }
    }

    .halo:focus-within {
      background: linear-gradient(120deg, #fff, #a8a8a8 24%, #454545 52%, #e5e5e5 82%, #666);
    }

    .halo:focus-within::before { opacity: .72; }

    input, textarea {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      border: 0;
      border-radius: 11px;
      outline: none;
      background: linear-gradient(180deg, rgba(19,19,19,.94), rgba(8,8,8,.97));
      color: var(--text);
      font: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.7);
    }
    input { height: 39px; padding: 0 11px; }
    textarea { min-height: 112px; padding: 10px 11px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #777; }
    input:focus, textarea:focus {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.8);
    }

    @media (prefers-reduced-motion: reduce) {
      .halo::after { animation: none; }
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 37px;
      margin: 0;
      padding: 9px 10px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(19,19,19,.94), rgba(8,8,8,.97));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.7);
    }
    .status-halo { margin-top: 15px; }
    /* Reduce the status beam's height so it doesn't dominate the short status row. */
    /* Reduce only the beam's vertical thickness; its existing horizontal span is unchanged. */
    .status-halo::after { height: 6px; }
    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #777;
      box-shadow: 0 0 0 3px rgba(255,255,255,.035);
    }
    #status { min-width: 0; white-space: pre-wrap; color: #c9c9c9; font-size: 11px; overflow-wrap: anywhere; }
    #status[data-kind="working"] + .dot, #status[data-kind="queued"] + .dot { background: #fff; }
    #status[data-kind="completed"] + .dot { background: #cfcfcf; }
    #status[data-kind="failed"] + .dot, #status[data-kind="error"] + .dot { background: #888; }

    #task-meta {
      margin-top: 8px;
      color: #686868;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    #run[data-active="true"] { border-color: #bdbdbd; background: rgba(255,255,255,.13); color: #fff; }
    #stop[data-active="true"] { border-color: #bdbdbd; color: #fff; }

    /* Keep the quiet ghost-button texture, but remove the animated glow/beam entirely. */
    button {
      position: relative;
      min-height: 38px;
      border: 1px solid #454545;
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,.025);
      color: #ededed;
      cursor: pointer;
      font: 650 12px/1.2 inherit;
      transition: border-color .2s, background .2s, color .2s, transform .2s, opacity .2s;
    }
    button:hover:not(:disabled) {
      border-color: #777;
      background: rgba(255,255,255,.075);
      color: #fff;
      transform: translateY(-1px);
    }
    button.secondary {
      background: rgba(255,255,255,.012);
      color: #c9c9c9;
    }
    button.secondary:hover:not(:disabled) { background: rgba(255,255,255,.06); }
    button:disabled {
      cursor: not-allowed;
      opacity: .4;
      transform: none;
    }
    button:focus-visible { outline: 2px solid #aaa; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }

    /* Scrollable execution output gets the same halo texture as the Task field. */
    .result-halo { margin-top: 11px; }
    .result-halo:has(#result:empty) { display: none; }
    #result {
      position: relative;
      z-index: 1;
      max-height: 190px;
      overflow: auto;
      margin: 0;
      padding: 11px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(19,19,19,.94), rgba(8,8,8,.97));
      color: #d4d4d4;
      font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.7);
    }

    /* Keep Copy wide and place the compact delete control immediately to its right. */
    .report-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #copy { flex: 1; margin-top: 0; }
    #delete-report { display: inline-flex; align-items: center; justify-content: center; width: 38px; min-width: 38px; min-height: 38px; padding: 8px; }
    #delete-report[hidden] { display: none; }
    #delete-report svg { width: 16px; height: 16px; display: block; }
    .footer { margin-top: 12px; color: #555; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <section class="beam-card">
    <div class="inner">
      <header>
        <p class="eyebrow">Local execution bridge</p>
        <h1>OpenClaw Bridge</h1>
        <p class="description">Explicitly tagged ChatGPT tasks, executed locally by OpenClaw.</p>
      </header>

      <section class="section">
        <label for="endpoint">Local API URL</label>
        <div class="halo"><input id="endpoint" value="http://127.0.0.1:8765" autocomplete="url"></div>
      </section>

      <section class="section">
        <label for="token">Bridge token</label>
        <div class="halo"><input id="token" type="password" autocomplete="off" placeholder="Local API token"></div>
      </section>

      <div class="actions">
        <button id="run" type="button">Open Bridge</button>
        <button id="stop" class="secondary" type="button">Close Bridge</button>
      </div>

      <div class="halo status-halo">
        <div class="status-row">
          <span class="dot" aria-hidden="true"></span>
          <div id="status" role="status" aria-live="polite">Ready.</div>
        </div>
      </div>
      <div id="task-meta">Bridge is closed. Only complete &lt;OpenClaw&gt; task blocks are sent.</div>

      <div class="halo result-halo">
        <pre id="result"></pre>
      </div>
      <div class="report-actions">
        <button id="copy" class="secondary" type="button" hidden>Copy latest report</button>
        <!-- This control deletes only the latest finished report after user confirmation. -->
        <button id="delete-report" class="secondary" type="button" aria-label="Delete latest report" title="Delete latest report" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>
          </svg>
        </button>
      </div>

      <div class="footer">LOCAL · USER-ARMED · TAGGED TASKS ONLY</div>
    </div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
