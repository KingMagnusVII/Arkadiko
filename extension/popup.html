<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Bridge Settings</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 16px; background: #090909; color: #eee; font: 13px/1.5 system-ui,sans-serif; }
    h1 { margin: 0; font-size: 18px; }
    p { color: #999; font-size: 12px; }
    label { display: block; margin: 13px 0 6px; color: #ccc; font-size: 11px; }
    input { width: 100%; height: 36px; border: 1px solid #444; border-radius: 8px; padding: 0 9px; background: #151515; color: white; }
    button { width: 100%; margin-top: 15px; min-height: 36px; border: 1px solid #555; border-radius: 8px; background: #202020; color: white; cursor: pointer; }
    #status { margin-top: 10px; color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <h1>OpenClaw Bridge</h1>
  <p>Configure the local API connection here. Use the small Run / Stop control inside ChatGPT to arm or disarm automation. It starts stopped.</p>
  <label for="endpoint">Local API URL</label>
  <input id="endpoint" value="http://127.0.0.1:8765">
  <label for="token">Bridge token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Local API token">
  <button id="save" type="button">Save settings</button>
  <div id="status" role="status" aria-live="polite">Loading settings…</div>
  <script src="popup.js"></script>
</body>
</html>
